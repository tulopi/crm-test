<header
    class="header-area bg-white border-radius transition"
    [ngClass]="{'active': isSidebarToggled, 'sticky': isSticky}"
    [class.component-dark-theme]="themeService.isDark()"
    [class.right-sidebar]="themeService.isRightSidebar()"
    [class.hide-sidebar]="themeService.isHideSidebar()"
    [class.dark-header]="themeService.isHeaderDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="d-md-flex align-items-center justify-content-between">
        <div class="header-left-side d-flex align-items-center">
            <div
                class="burger-menu cursor-pointer transition d-xl-none"
                [ngClass]="{'active': isSidebarToggled}"
                (click)="toggle()"
            >
                <span class="top-bar d-block bg-black transition"></span>
                <span class="middle-bar d-block bg-black transition"></span>
                <span class="bottom-bar d-block bg-black transition"></span>
            </div>
            <form class="search-box position-relative">
                <i class="material-symbols-outlined">search</i>
                <input
                    type="text"
                    class="input-search d-block w-100 border-none outline-0"
                    placeholder="Buscar…"
                />
            </form>
        </div>
        <ul class="header-right-side d-flex align-items-center mt-0 mb-0 pl-0 list-unstyled">
            <li>
                <button
                    type="button"
                    mat-button
                    class="dark-swtich-btn"
                    (click)="toggleTheme()"
                    [attr.aria-label]="themeService.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
                >
                    <i class="material-symbols-outlined">
                        {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
                    </i>
                </button>
            </li>
            <li>
                <button
                    type="button"
                    mat-icon-button
                    [matMenuTriggerFor]="messagesMenu"
                    class="messages-menu-btn p-0"
                    aria-label="Correo"
                >
                    <i class="material-symbols-outlined">mail</i>
                </button>
                <mat-menu class="messages-menu-dropdown" #messagesMenu="matMenu" xPosition="before">
                    <div [class.dark-menu]="themeService.isDark() || themeService.isHeaderDark()">
                        <div class="title d-flex align-items-center justify-content-between">
                            <span class="fw-medium">Correo</span>
                        </div>
                        <div class="menu-body px-3 py-4 text-center text-body">
                            <p class="mb-0">No hay mensajes</p>
                        </div>
                    </div>
                </mat-menu>
            </li>
            <li>
                <button
                    type="button"
                    mat-icon-button
                    [matMenuTriggerFor]="notificationsMenu"
                    class="notifications-menu-btn p-0"
                    aria-label="Notificaciones"
                >
                    <i class="material-symbols-outlined">notifications</i>
                </button>
                <mat-menu class="notifications-menu-dropdown" #notificationsMenu="matMenu" xPosition="before">
                    <div [class.dark-menu]="themeService.isDark() || themeService.isHeaderDark()">
                        <div class="title d-flex align-items-center justify-content-between">
                            <span class="fw-medium">Notificaciones</span>
                        </div>
                        <div class="menu-body px-3 py-4 text-center text-body">
                            <p class="mb-0">No hay notificaciones</p>
                        </div>
                    </div>
                </mat-menu>
            </li>
            <li>
                <button
                    type="button"
                    mat-button
                    [matMenuTriggerFor]="profileMenu"
                    class="profile-menu-btn"
                    aria-label="Menú de usuario"
                >
                    <img src="images/admin.png" alt="" />
                    <span class="status d-inline-block rounded-circle position-absolute"></span>
                </button>
                <mat-menu class="profile-menu-dropdown" #profileMenu="matMenu" xPosition="before">
                    <div [class.dark-menu]="themeService.isDark() || themeService.isHeaderDark()">
                        <div class="menu-header d-flex align-items-center">
                            <img src="images/admin.png" alt="" />
                            <div class="title">
                                <span class="d-inline-block fw-medium text-black">Usuario</span>
                                <span class="designation d-block text-body">MCRM</span>
                            </div>
                        </div>
                        <ul class="menu-body pl-0 mb-0 mt-0 list-unstyled">
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">person</i>
                                Perfil
                                <a routerLink="/perfil" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">contact_page</i>
                                Ficha laboral
                                <a routerLink="/ficha-laboral" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">school</i>
                                Academia
                                <a routerLink="/academia" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">inbox</i>
                                Buzón
                                <a routerLink="/buzon" class="link-btn d-block position-absolute"></a>
                            </li>
                            <li class="position-relative transition fw-medium">
                                <i class="material-symbols-outlined">logout</i>
                                Cerrar sesión
                                <a routerLink="/auth/logout" class="link-btn d-block position-absolute"></a>
                            </li>
                        </ul>
                    </div>
                </mat-menu>
            </li>
        </ul>
    </div>
</header>
