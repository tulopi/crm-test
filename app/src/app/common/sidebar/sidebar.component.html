<div
    class="sidebar-area bg-white"
    [ngClass]="{'active': isSidebarToggled}"
    [class.component-dark-theme]="themeService.isDark()"
    [class.dark-sidebar]="themeService.isSidebarDark()"
    [class.right-sidebar]="themeService.isRightSidebar()"
    [class.hide-sidebar]="themeService.isHideSidebar()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="logo bg-white">
        <a routerLink="/" class="d-flex align-items-center">
            <img src="images/logo.png" alt="Logotipo" class="sidebar-logo-img" />
            <span class="fw-semibold fs-18">Reunificación</span>
        </a>
    </div>
    <div
        (click)="toggle()"
        class="burger-menu"
        [ngClass]="{'active': isSidebarToggled}"
    >
        <span class="top-bar"></span>
        <span class="middle-bar"></span>
        <span class="bottom-bar"></span>
    </div>
    <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
            <div class="sidebar-menu">
                <mat-accordion>
                    <span class="sub-title text-body">Escritorio</span>
                    <a
                        routerLink="/"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">space_dashboard</i>
                        <span class="title">Inicio</span>
                    </a>
                    <a
                        routerLink="/clientes"
                        routerLinkActive="active"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">group</i>
                        <span class="title">Clientes</span>
                    </a>
                    <span class="sub-title text-body">Procesos</span>
                    <a
                        routerLink="/reunificacion"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">dashboard</i>
                        <span class="title">Panel</span>
                    </a>
                    <a
                        routerLink="/reunificacion/procesos"
                        routerLinkActive="active"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">sync</i>
                        <span class="title">Procesos</span>
                    </a>
                    <a
                        routerLink="/reunificacion/morosos"
                        routerLinkActive="active"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">gavel</i>
                        <span class="title">Morosos</span>
                    </a>
                    <a
                        routerLink="/reunificacion/seguimiento"
                        routerLinkActive="active"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">call</i>
                        <span class="title">Seguimiento</span>
                    </a>
                    <a
                        routerLink="/reunificacion/solicitudes-pago"
                        routerLinkActive="active"
                        class="sidebar-menu-link"
                    >
                        <i class="material-symbols-outlined" aria-hidden="true">payments</i>
                        <span class="title">Solicitudes de pago</span>
                    </a>
                </mat-accordion>
            </div>
        </div>
    </ng-scrollbar>
</div>
